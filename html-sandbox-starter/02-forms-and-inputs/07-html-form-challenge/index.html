<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML & CSS Sandbox</title>
</head>

<body>
  <h1>HTML & CSS Sandbox - HTML Form Challenge</h1>
  <h2>Apartment Search</h2>
  <form action="">
    <label for="location">Location</label>
    <input type="text" id="location" name="location" />
    <br /> <br />
    <label for="monthly-price">Monthly Price</label>
    <input type="number" id="monthly-price" name="monthly-price" min="0" max="5000" step="100" value="1000" />
    <br /> <br />
    <label for="bedrooms">Number of Bedrooms</label>
    <input type="text" id="bedrooms" name="bedrooms" min="0" max="10" value="1" />
    <br /> <br />
    <label for="bathrooms">Number of Bathrooms</label>
    <input type="text" id="bathrooms" name="bathrooms" min="0" max="10" value="1" />
    <br /> <br />
    <label for="pets">Pets Allowed</label>
    <input type="checkbox" id="pets" name="pets" />
    <br /> <br />
    <label for="date-available">Date Availble</label>
    <input type="date" id="date-available" name="date-avail" />
    <br /> <br />
    <button type="submit">Submit</button>
  </form>
</body>

</html>
